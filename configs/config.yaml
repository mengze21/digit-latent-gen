# Configuration for VAE model, training, and testing.

model:
  in_channels: 1
  height: 32
  width: 32
  latent_dim: 32
  num_classes: 10

data:
  root_dir: "data"

training:
  batch_size: 32
  epochs: 10
  learning_rate: 0.01
  kl_weight: 1.0
  shuffle: true
  num_workers: 0
  checkpoint_dir: "checkpoints"

testing:
  batch_size: 64
  num_workers: 0
  checkpoint_path: "checkpoints/latest.pt"
  save_reconstructions: true
  output_dir: "outputs"
