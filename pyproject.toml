[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digit-latent-gen"
version = "0.1.0"
description = "Digit latent generation model implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib>=3.7.0",
    "tqdm",
    "tensorboard>=2.13.0",
    "PyYAML>=6.0",
    "streamlit"
]
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
