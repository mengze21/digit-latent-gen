[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digit-latent-gen"
version = "0.1.0"
description = "Digit latent generation model implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib>=3.7.0",
    "tqdm",
    "tensorboard>=2.13.0",
    "PyYAML>=6.0",
    "streamlit"
]
authors = [
    {name = "mengze21", email = "lumengze@gmail.com"}
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts", "streamlit_app.py"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["yaml", "tqdm", "torchvision", "torchvision.*"]
ignore_missing_imports = true
